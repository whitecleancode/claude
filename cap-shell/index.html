<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Life OS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b1120;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 2px solid transparent;
      border-top-color: #22d3ee;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #22d3ee, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    .subtitle { color: #64748b; font-size: 0.875rem; }
    .offline {
      display: none;
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 0.75rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .offline p { font-size: 0.8rem; color: #94a3b8; }
    .retry-btn {
      margin-top: 0.75rem;
      padding: 0.5rem 1.5rem;
      border-radius: 0.5rem;
      background: linear-gradient(135deg, #22d3ee, #a78bfa);
      color: #0b1120;
      font-weight: 600;
      font-size: 0.875rem;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner" id="spinner"></div>
    <div class="title">Life OS</div>
    <p class="subtitle" id="status">Подключение...</p>
    <div class="offline" id="offline">
      <p>Нет подключения к интернету.</p>
      <p>Проверьте соединение и попробуйте снова.</p>
      <button class="retry-btn" onclick="location.reload()">Повторить</button>
    </div>
  </div>
  <script>
    // This page is shown only when the server URL is unreachable.
    // Normally Capacitor loads the remote URL directly.
    setTimeout(() => {
      if (!navigator.onLine) {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('status').textContent = 'Офлайн';
        document.getElementById('offline').style.display = 'block';
      }
    }, 3000);
  </script>
</body>
</html>
